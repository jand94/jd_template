repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.14
    hooks:
      - id: ruff
        args: ["--config=backend/pyproject.toml", "--fix"]
        files: ^backend/
      - id: ruff-format
        args: ["--config=backend/pyproject.toml"]
        files: ^backend/
  - repo: local
    hooks:
      - id: prettier
        name: prettier
        entry: npm --prefix frontend exec -- prettier --write
        language: system
        files: ^frontend/
        types_or: [javascript, ts, tsx, css, json, markdown]
