[pytest]
DJANGO_SETTINGS_MODULE = backend.settings
pythonpath = .
testpaths = apps
addopts = -ra --strict-markers --cov=apps --cov-report=term-missing
markers =
    unit: Einzelne Funktionen und Geschäftsregeln, ohne Datenbank und HTTP.
    integration: Zusammenspiel von Django, PostgreSQL und Services.
    api: HTTP-Endpunkte über den DRF-APIClient.
